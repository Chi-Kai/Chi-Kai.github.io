baseURL = "https://chi-kai.github.io"
languageCode = "zh-cn"
DefaultContentLanguage = "zh-cn"
hasCJKLanguage = true
title = "悉达多"
theme = "PaperMod"
googleAnalytics = "G-CWBXLVG90W"

enableRobotsTXT = true
buildDrafts = false
buildFuture = false
buildExpired = false

[pagination]
pagerSize = 10

[minify]
disableXML = true

[outputs]
home = ["HTML", "RSS", "JSON"]

[taxonomies]
category = "categories"
series = "series"
tag = "tags"

[params]
env = "production"
title = "悉达多"
description = "记录 AI Infra 与云原生（Kubernetes / Cloud Native）方向的技术总结与思考。"
keywords = ["AI Infra", "Kubernetes", "Cloud Native", "云原生", "Blog"]
author = "K-C"
DateFormat = "2006-01-02"
defaultTheme = "auto"
disableThemeToggle = false
ShowReadingTime = true
ShowShareButtons = false
ShowPostNavLinks = true
ShowBreadCrumbs = true
ShowCodeCopyButtons = true
ShowWordCount = true
ShowRssButtonInSectionTermList = true
UseHugoToc = true
disableSpecial1stPost = false
disableScrollToTop = false
comments = false
hidemeta = false
hideSummary = false
showtoc = true
tocopen = false

[params.homeInfoParams]
Title = "悉达多"
Content = """
你好，我是 K-C。这里主要记录 **AI Infra** 与 **云原生（K8s / Cloud Native）** 方向的技术总结与思考，也归档了一些早期的学习笔记。
"""

[[params.socialIcons]]
name = "github"
url = "https://github.com/Chi-Kai"

[[params.socialIcons]]
name = "email"
url = "mailto:chikai0307@gmail.com"

[[params.socialIcons]]
name = "rss"
url = "index.xml"

[params.assets]
disableFingerprinting = true

[params.fuseOpts]
isCaseSensitive = false
shouldSort = true
location = 0
distance = 1000
threshold = 0.4
minMatchCharLength = 0
keys = ["title", "permalink", "summary", "content"]

[markup]
  [markup.goldmark.renderer]
    unsafe = true
  [markup.highlight]
    noClasses = false
    codeFences = true
    guessSyntax = true
    style = "monokailight"
  [markup.goldmark.extensions.passthrough]
    enable = true
    [markup.goldmark.extensions.passthrough.delimiters]
      block = [['\[', '\]'], ['$$', '$$']]
      inline = [['\(', '\)']]

[[menu.main]]
identifier = "posts"
name = "文章"
url = "/post/"
weight = 1

[[menu.main]]
identifier = "categories"
name = "分类"
url = "/categories/"
weight = 2

[[menu.main]]
identifier = "tags"
name = "标签"
url = "/tags/"
weight = 3

[[menu.main]]
identifier = "archives"
name = "归档"
url = "/archives/"
weight = 4

[[menu.main]]
identifier = "search"
name = "搜索"
url = "/search/"
weight = 5

[[menu.main]]
identifier = "about"
name = "关于"
url = "/about/"
weight = 6
